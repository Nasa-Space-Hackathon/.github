<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="DevVerse, a team at the NASA Space Apps Challenge">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a1f"/>
      <stop offset="0.6" stop-color="#0b1a45"/>
      <stop offset="1" stop-color="#0d1c4f"/>
    </linearGradient>
    <style>
      .title { font: 700 58px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .kicker { font: 600 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4fd1ff; letter-spacing: 4px; }
      .tagline { font: 400 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c7d3f5; }
      .twinkle { animation: twinkle 3.5s ease-in-out infinite; }
      .delay { animation-delay: 1.4s; }
      @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) {
        .twinkle { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

